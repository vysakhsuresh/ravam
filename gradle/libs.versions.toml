[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
junit = "4.13.2"
shizuku = "13.1.5"
libadb = "3.1.1"
sunSecurity = "1.1"
conscrypt = "2.5.3"
hiddenApiBypass = "6.1"

[libraries]
androidx-core-ktx            = { group = "androidx.core",              name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
androidx-lifecycle-compose    = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }
androidx-lifecycle-service    = { group = "androidx.lifecycle",         name = "lifecycle-service",             version.ref = "lifecycle" }
androidx-activity-compose    = { group = "androidx.activity",          name = "activity-compose",              version.ref = "activityCompose" }
androidx-compose-bom         = { group = "androidx.compose",           name = "compose-bom",                   version.ref = "composeBom" }
androidx-compose-ui          = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-ui-tooling  = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-ui-preview  = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-material3   = { group = "androidx.compose.material3", name = "material3" }
junit                        = { group = "junit",                      name = "junit",                         version.ref = "junit" }
shizuku-api                  = { group = "dev.rikka.shizuku",          name = "api",                           version.ref = "shizuku" }
shizuku-provider             = { group = "dev.rikka.shizuku",          name = "provider",                      version.ref = "shizuku" }
libadb                       = { group = "com.github.MuntashirAkon",   name = "libadb-android",                version.ref = "libadb" }
sun-security                 = { group = "com.github.MuntashirAkon",   name = "sun-security-android",          version.ref = "sunSecurity" }
conscrypt                    = { group = "org.conscrypt",              name = "conscrypt-android",             version.ref = "conscrypt" }
hiddenapibypass              = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass",              version.ref = "hiddenApiBypass" }

[plugins]
android-application = { id = "com.android.application",         version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",            version.ref = "kotlin" }
